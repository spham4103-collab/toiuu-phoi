# ==============================================================================
# CẤU HÌNH NGINX CHO WEBSITE TỐI ƯU XẾP PHÔI - CƠ KHÍ AN BÌNH
# File: /etc/nginx/sites-available/toiuu-anbinh
# ==============================================================================

server {
    listen 80;
    server_name xepphoianbinh.com www.xepphoianbinh.com; # Thay bằng tên miền của bạn

    # Cho phép tải các file 3D .IGS và dự án lớn lên tới 100MB
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Cấu hình Header chuẩn
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình Realtime SSE (Server-Sent Events) không bị ngắt quãng hoặc delay
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
